server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Gehashte Build-Assets dauerhaft cachen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html immer revalidieren, damit neue Deploys ankommen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
